spring.application.name=backend

# Server
server.port=${SERVER_PORT:8080}

# Database (all values overridable via environment variables)
spring.datasource.url=jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:mobile_messenger}
spring.datasource.username=${DB_USERNAME:postgres}
spring.datasource.password=${DB_PASSWORD:postgres}
spring.datasource.driver-class-name=org.postgresql.Driver

# Retry connecting instead of failing startup immediately if the database
# is not yet accepting connections (e.g. still starting up in Docker Compose).
spring.datasource.hikari.initialization-fail-timeout=-1
spring.datasource.hikari.connection-timeout=5000

# JPA / Hibernate
# Schema is owned by Flyway migrations (src/main/resources/db/migration) - Hibernate
# only validates that entity mappings match, it never alters the schema itself.
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false

# Flyway
spring.flyway.enabled=true

# Actuator
management.endpoints.web.exposure.include=health
management.endpoint.health.show-details=never

# JWT
# jwt.secret MUST be overridden via the JWT_SECRET environment variable in any
# shared or production environment - this default is for local development only.
jwt.secret=${JWT_SECRET:dev-only-insecure-secret-please-override-via-JWT_SECRET-env-var-1234567890}
jwt.expiration-minutes=${JWT_EXPIRATION_MINUTES:1440}

spring.application.name=backend

# Server
server.port=${SERVER_PORT:8080}

# Database (all values overridable via environment variables)
spring.datasource.url=jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:mobile_messenger}
spring.datasource.username=${DB_USERNAME:postgres}
spring.datasource.password=${DB_PASSWORD:postgres}
spring.datasource.driver-class-name=org.postgresql.Driver

# Retry connecting instead of failing startup immediately if the database
# is not yet accepting connections (e.g. still starting up in Docker Compose).
spring.datasource.hikari.initialization-fail-timeout=-1
spring.datasource.hikari.connection-timeout=5000

# JPA / Hibernate
# Schema is owned by Flyway migrations (src/main/resources/db/migration) - Hibernate
# only validates that entity mappings match, it never alters the schema itself.
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false

# Flyway
spring.flyway.enabled=true

# Actuator
management.endpoints.web.exposure.include=health
management.endpoint.health.show-details=never

# JWT
# jwt.secret MUST be overridden via the JWT_SECRET environment variable in any
# shared or production environment - this default is for local development only.
jwt.secret=${JWT_SECRET:dev-only-insecure-secret-please-override-via-JWT_SECRET-env-var-1234567890}
jwt.expiration-minutes=${JWT_EXPIRATION_MINUTES:1440}

# File storage (profile avatars today; the same abstraction will later serve
# chat images/videos/audio). In Docker this is backed by a named volume so
# uploads survive container recreation - see docker-compose.yml.
storage.root-dir=${STORAGE_ROOT_DIR:./data/storage}

# Multipart upload limits - kept in step with the 5MB avatar limit enforced
# in code (ImageValidator.MAX_AVATAR_SIZE_BYTES); the request-size ceiling
# leaves a little headroom for multipart framing overhead.
spring.servlet.multipart.max-file-size=5MB
spring.servlet.multipart.max-request-size=6MB

# Email
# app.email.provider selects the EmailService implementation:
#   log  (default) - logs the verification/reset link instead of sending; safe
#                     for local development and testing without SMTP credentials
#   smtp            - sends real emails via SMTP (requires the spring.mail.*
#                     settings below to point at a real server)
app.email.provider=${EMAIL_PROVIDER:log}
app.email.from=${SMTP_FROM_EMAIL:no-reply@mobilemessenger.local}
# Base URL embedded in verification/reset links. Defaults to the app's own
# custom URL scheme (see the Flutter app's Android deep-link config); point
# this at a real HTTPS domain instead if/when one exists.
app.frontend-base-url=${FRONTEND_BASE_URL:mobilemessenger://}

# Only used when app.email.provider=smtp.
spring.mail.host=${SMTP_HOST:localhost}
spring.mail.port=${SMTP_PORT:587}
spring.mail.username=${SMTP_USERNAME:}
spring.mail.password=${SMTP_PASSWORD:}
spring.mail.properties.mail.smtp.auth=${SMTP_AUTH:true}
spring.mail.properties.mail.smtp.starttls.enable=${SMTP_STARTTLS:true}

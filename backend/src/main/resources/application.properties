spring.application.name=backend

# Server
# PORT is what most hosting platforms inject; SERVER_PORT is the explicit override.
server.port=${SERVER_PORT:${PORT:8080}}

# Browser origins allowed to call the API and open the WebSocket (comma-separated,
# e.g. https://chat.example.com). '*' (the default) suits local development; a
# deployment that serves the web app from a known address should list only that.
# The mobile app is not a browser and is unaffected by this setting.
app.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:*}

# Database (all values overridable via environment variables)
spring.datasource.url=jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:mobile_messenger}
spring.datasource.username=${DB_USERNAME:postgres}
spring.datasource.password=${DB_PASSWORD:postgres}
spring.datasource.driver-class-name=org.postgresql.Driver

# Retry connecting instead of failing startup immediately if the database
# is not yet accepting connections (e.g. still starting up in Docker Compose).
spring.datasource.hikari.initialization-fail-timeout=-1
spring.datasource.hikari.connection-timeout=5000

# JPA / Hibernate
# Schema is owned by Flyway migrations (src/main/resources/db/migration) - Hibernate
# only validates that entity mappings match, it never alters the schema itself.
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false

# Flyway
spring.flyway.enabled=true

# Actuator
management.endpoints.web.exposure.include=health
management.endpoint.health.show-details=never

# JWT
# jwt.secret MUST be overridden via the JWT_SECRET environment variable in any
# shared or production environment - this default is for local development only.
jwt.secret=${JWT_SECRET:dev-only-insecure-secret-please-override-via-JWT_SECRET-env-var-1234567890}
jwt.expiration-minutes=${JWT_EXPIRATION_MINUTES:1440}

# Encryption (see EncryptionService / the README's Security section).
# app.encryption.master-key MUST be a Base64-encoded 256-bit (32-byte) AES
# key, and MUST be overridden via the ENCRYPTION_MASTER_KEY environment
# variable in any shared or production environment - the value below is a
# fixed, publicly-committed development-only default, safe only because no
# real user data is ever protected by it. The app refuses to start if this
# property is missing, not valid Base64, or does not decode to exactly 32
# bytes (never silently truncated or padded). Generate a real key with:
#   openssl rand -base64 32
app.encryption.master-key=${ENCRYPTION_MASTER_KEY:Yy67N5glGXaN27Cljm9eJg9bNo4JVN9hAj9pgWMBwgU=}

# File storage (profile avatars today; the same abstraction will later serve
# chat images/videos/audio). In Docker this is backed by a named volume so
# uploads survive container recreation - see docker-compose.yml.
storage.root-dir=${STORAGE_ROOT_DIR:./data/storage}

# Multipart upload limits - the ceiling here must be at least as large as
# the largest single-file limit below (currently the 50MB video cap), with a
# little headroom left for multipart framing overhead.
spring.servlet.multipart.max-file-size=55MB
spring.servlet.multipart.max-request-size=56MB

# Chat attachment size limits (bytes), enforced in AttachmentService after
# the file's real type has been sniffed from its content - not from the
# client-supplied Content-Type, which is never trusted. Defaults: 10MB for
# images, 50MB for videos, 15MB for audio (voice messages - mono 16kHz WAV,
# ~1.9MB/minute, so this comfortably covers several minutes).
app.attachments.max-image-size-bytes=${ATTACHMENT_MAX_IMAGE_SIZE_BYTES:10485760}
app.attachments.max-video-size-bytes=${ATTACHMENT_MAX_VIDEO_SIZE_BYTES:52428800}
app.attachments.max-audio-size-bytes=${ATTACHMENT_MAX_AUDIO_SIZE_BYTES:15728640}

# Email
# app.email.provider selects the EmailService implementation:
#   log  (default) - logs the verification/reset code instead of sending; safe
#                     for local development and testing without SMTP credentials
#   smtp            - sends real emails via SMTP (requires the spring.mail.*
#                     settings below to point at a real server)
# Verification and password reset both email the user a short 6-digit code to
# enter directly in the app - never a clickable link - so no frontend/deep-link
# base URL is needed here.
app.email.provider=${EMAIL_PROVIDER:log}
app.email.from=${SMTP_FROM_EMAIL:no-reply@mobilemessenger.local}

# Only used when app.email.provider=smtp.
spring.mail.host=${SMTP_HOST:localhost}
spring.mail.port=${SMTP_PORT:587}
spring.mail.username=${SMTP_USERNAME:}
spring.mail.password=${SMTP_PASSWORD:}
spring.mail.properties.mail.smtp.auth=${SMTP_AUTH:true}
spring.mail.properties.mail.smtp.starttls.enable=${SMTP_STARTTLS:true}

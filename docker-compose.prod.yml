# Production overlay - use it together with docker-compose.yml and the "prod"
# profile on a public server (README §23 Deployment):
#
#   docker compose -f docker-compose.yml -f docker-compose.prod.yml --profile prod up -d --build
#
# It changes two things relative to the local-development setup, and nothing
# else (local `./start.sh` / `docker compose up` never read this file):
#
# 1. Nothing but Caddy is reachable from the network. Docker publishes a
#    container's ports by editing iptables directly, which BYPASSES host
#    firewalls such as ufw - so leaving Postgres (5432), the backend (8080)
#    and the raw web container (8090) published would expose them to the
#    Internet no matter what the firewall says. Here they are only reachable
#    from other containers on the Compose network (which is all Caddy needs).
# 2. The insecure development defaults are refused: the stack will not start
#    unless real secrets are supplied, instead of silently falling back to the
#    publicly-committed development JWT secret / encryption key / DB password.
services:
  postgres:
    ports: !reset []
    environment:
      POSTGRES_PASSWORD: ${DB_PASSWORD:?Set DB_PASSWORD in .env (a long random value) for a production deployment}

  backend:
    ports: !reset []
    environment:
      DB_PASSWORD: ${DB_PASSWORD:?Set DB_PASSWORD in .env}
      JWT_SECRET: ${JWT_SECRET:?Set JWT_SECRET in .env (openssl rand -base64 48)}
      ENCRYPTION_MASTER_KEY: ${ENCRYPTION_MASTER_KEY:?Set ENCRYPTION_MASTER_KEY in .env (openssl rand -base64 32) and never change it once data exists}
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:?Set CORS_ALLOWED_ORIGINS in .env to https://<PUBLIC_DOMAIN>}

  caddy:
    environment:
      PUBLIC_DOMAIN: ${PUBLIC_DOMAIN:?Set PUBLIC_DOMAIN in .env to the public hostname this server is reachable at (see README §23 Deployment)}

  web:
    ports: !reset []
    build:
      args:
        API_BASE_URL: ${WEB_API_BASE_URL:?Set WEB_API_BASE_URL in .env to https://<PUBLIC_DOMAIN>}

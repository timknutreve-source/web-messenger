server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    gzip on;
    gzip_types text/plain text/css application/javascript application/json image/svg+xml application/wasm font/ttf font/otf application/x-font-ttf;

    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "no-referrer" always;
    add_header X-Frame-Options "SAMEORIGIN" always;

    # The app shell is versioned by its content hash inside these files, but the
    # entry points themselves must never be served stale after a new deploy.
    location = /index.html            { add_header Cache-Control "no-cache"; }
    location = /flutter_service_worker.js { add_header Cache-Control "no-cache"; }
    location = /flutter_bootstrap.js  { add_header Cache-Control "no-cache"; }
    location = /version.json          { add_header Cache-Control "no-cache"; }

    # Single-page app: unknown paths fall back to the app, which routes them itself.
    location / {
        try_files $uri $uri/ /index.html;
    }
}
